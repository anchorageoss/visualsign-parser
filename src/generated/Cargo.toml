[package]
name = "generated"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
qos_hex = { workspace = true}

prost = { version = "0.12", features = [
  "prost-derive",
  "std",
], default-features = false }
prost-types = { version = "0.12" }
borsh = { version = "1.5.7", features = [
  "std",
  "derive",
], default-features = false }

# Optional deps
serde = { version = "1", features = [
  "derive",
], optional = true, default-features = false }
tonic = { version = "0.10", optional = true, features = [
  "transport",
], default-features = false }
tonic-reflection = { version = "0.10", optional = true, default-features = false }

[features]
# Derive serde serialize/deserialize on some select types and general serde compatibility
serde_derive = ["serde"]
# Tonic server and clients
tonic_types = ["tonic", "tonic-reflection"]

[lints]
workspace = true
