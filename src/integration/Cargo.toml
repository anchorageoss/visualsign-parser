[package]
name = "integration"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
qos_core = { workspace = true, features = ["mock"] }
qos_crypto = { workspace = true }
qos_p256 = { workspace = true }
qos_hex = { workspace = true }
qos_test_primitives = { workspace = true }

parser_app = { path = "../parser/app" }

generated = { path = "../generated", default-features = false }

host_primitives = { path = "../host_primitives" }
health_check = { path = "../health_check" }

tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
borsh = { version = "1.0", features = [
  "std",
  "derive",
], default-features = false }
tonic = "0.10"
rand = "0.9.1"
futures = "0.3"
serde_json = { version = "1.0", features = ["std"], default-features = false }
tracing-test = "0.2.5"

hex = { workspace = true }

[dev-dependencies]
visualsign-solana = { path = "../chain_parsers/visualsign-solana" }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
turnkey_api_key_stamper = "0.10"

[lints]
workspace = true

[package.metadata.cargo-machete]
# The suite spawns the built `parser_app` binary (`make test` builds it first);
# not imported from Rust, so machete can't see it.
ignored = ["parser_app"]
