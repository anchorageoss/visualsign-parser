[package]
name = "visualsign-near"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
borsh = "1.5"
bs58 = "0.5.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.0", features = ["derive"], optional = true }
ed25519-dalek = "2"
generated = { path = "../../generated" }
hex = "0.4.3"
k256 = "0.13"
# Pulls in ~34 transitive crates as mandatory (non-dev) dependencies, including
# serde_yaml 0.9 (unsafe-libyaml) and the arbitrary fuzzing derive.
near-primitives = "0.35.1"
parser_cli_core = { path = "../../parser/cli-core", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tracing = { workspace = true }
visualsign = { workspace = true }

near-sdk = { workspace = true }

defuse-core = { workspace = true }
defuse-crypto = { workspace = true }
defuse-deadline = { workspace = true }

[dev-dependencies]
near-crypto = "0.35.1"

[features]
default = ["cli-plugin"]
cli-plugin = ["dep:clap", "dep:parser_cli_core"]
dev-signing = []
diagnostics = ["visualsign/diagnostics"]

[lints]
workspace = true
