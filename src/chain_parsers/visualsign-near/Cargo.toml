[package]
name = "visualsign-near"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.0", features = ["derive"], optional = true }
ed25519-dalek = "2"
generated = { path = "../../generated" }
hex = "0.4.3"
k256 = "0.13"
parser_cli_core = { path = "../../parser/cli-core", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tracing = { workspace = true }
visualsign = { workspace = true }

near-sdk = { workspace = true }

defuse-core = { workspace = true }
defuse-crypto = { workspace = true }
defuse-deadline = { workspace = true }

[dev-dependencies]
# Differential-test oracles for the local wire types in src/primitives.rs.
# Never a normal dependency: near-primitives pulls zstd-sys and near-crypto
# pulls secp256k1-sys (native C).
near-crypto = "0.35.1"
near-primitives = "0.35.1"
parser_cli_core = { path = "../../parser/cli-core", features = ["test-utils"] }

[features]
default = ["cli-plugin"]
cli-plugin = ["dep:clap", "dep:parser_cli_core"]
dev-signing = []
diagnostics = ["visualsign/diagnostics"]

[lints]
workspace = true
