[package]
name = "visualsign-near"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5.1"
clap = { version = "4.0", features = ["derive"], optional = true }
generated = { path = "../../generated" }
hex = "0.4.3"
parser_cli_core = { path = "../../parser/cli-core", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tracing = { workspace = true }
visualsign = { workspace = true }
visualsign-intents = { path = "../../visualsign-intents" }

near-sdk = { workspace = true }

defuse-core = { workspace = true }
defuse-nep413 = { workspace = true }

[dev-dependencies]
visualsign-intents = { path = "../../visualsign-intents", features = ["test-support"] }
# Differential-test oracles for the local wire types in src/primitives.rs.
# near-primitives must never be a normal dependency: it makes zstd (zstd-sys,
# native C) mandatory. near-crypto (and secp256k1-sys 0.8) is still in the
# normal tree, via near-sdk's `non-contract-usage` feature; listing it here only
# makes it available to the tests.
near-crypto = "0.35.1"
near-primitives = "0.35.1"
parser_cli_core = { path = "../../parser/cli-core", features = ["test-utils"] }

[features]
default = ["cli-plugin"]
cli-plugin = ["dep:clap", "dep:parser_cli_core"]
# Forwarded: the CLI signing helpers this gated now live in visualsign-intents,
# so parser_cli enabling `visualsign-near/dev-signing` still reaches them.
dev-signing = ["visualsign-intents/dev-signing"]
diagnostics = ["visualsign/diagnostics", "visualsign-intents/diagnostics"]

[lints]
workspace = true
