[package]
name = "visualsign-sui"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
tracing = { workspace = true }

base64 = { workspace = true }

bcs = "0.1.6"
borsh = { version = "1.5.5", features = ["derive"] }
bech32 = "0.9.1"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Pure-Rust Sui BCS types (no fastcrypto, blst, ring, secp256k1 or zstd).
# `hash` adds Blake2b-256 for Move package digests.
sui-sdk-types = { version = "0.4.0", default-features = false, features = ["serde", "hash"] }

visualsign = { workspace = true }

[lints]
workspace = true
