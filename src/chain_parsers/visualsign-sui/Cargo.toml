[package]
name = "visualsign-sui"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
tracing = { workspace = true }

base64 = { workspace = true }

bcs = "0.1.6"
borsh = { version = "1.5.5", features = ["derive"] }
bech32 = "0.9.1"
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Pure-Rust Sui BCS types (no fastcrypto, blst, ring, secp256k1 or zstd).
# `hash` adds Blake2b-256 for Move package digests.
sui-sdk-types = { version = "0.4.0", default-features = false, features = ["serde", "hash"] }

# Pure-Rust point/scalar parsing preserves legacy envelope rejection checks;
# transaction signatures are never verified by the parser.
ed25519-consensus = { version = "2", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

visualsign = { workspace = true }

# Differential oracle only: retain the exact pre-migration upstream revision.
[dev-dependencies]
move-core-types = { git = "https://github.com/MystenLabs/sui", tag = "mainnet-v1.68.1", package = "move-core-types" }
move-bytecode-utils = { git = "https://github.com/MystenLabs/sui", tag = "mainnet-v1.68.1", package = "move-bytecode-utils" }
sui-types = { git = "https://github.com/MystenLabs/sui", tag = "mainnet-v1.68.1", package = "sui-types" }
sui-json-rpc-types = { git = "https://github.com/MystenLabs/sui", tag = "mainnet-v1.68.1", package = "sui-json-rpc-types" }

[lints]
workspace = true
