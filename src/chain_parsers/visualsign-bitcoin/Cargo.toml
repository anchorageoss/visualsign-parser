[package]
name = "visualsign-bitcoin"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
default    = ["cli-plugin"]
cli-plugin = ["dep:clap", "dep:parser_cli_core", "dep:generated"]
# JSON form of `BitcoinMetadata` (`BitcoinMetadata::from_json` / `to_json`).
json = ["dep:serde", "dep:serde_json"]
# Read-only Bitcoin Core JSON-RPC wallet source and `parser_cli bitcoin
# wallet-check`. CLI only: parser_app and the images must not enable it.
bitcoind-rpc = ["json"]

[dependencies]
base64 = { workspace = true }
bitcoin = "0.32"
clap = { version = "4.0", features = ["derive"], optional = true }
generated = { path = "../../generated", optional = true }
parser_cli_core = { path = "../../parser/cli-core", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = "2.0.12"
visualsign = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "airgap_regtest"
required-features = ["bitcoind-rpc"]

[lints]
workspace = true
