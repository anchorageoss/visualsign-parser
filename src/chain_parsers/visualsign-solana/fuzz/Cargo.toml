[package]
name = "visualsign-solana-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bincode = "1.3.3"
solana-hash = { version = "4.7.0" }
solana-message = { version = "6.0.0", features = ["serde"] }
solana-pubkey = { version = "4.4.0" }
solana-signature = { version = "3.6.0" }
solana-transaction = { version = "6.0.0", features = ["serde"] }
visualsign = { path = "../../../visualsign" }

[dependencies.visualsign-solana]
path = ".."

[[bin]]
name = "fuzz_transaction_string"
path = "fuzz_targets/fuzz_transaction_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_versioned_transaction"
path = "fuzz_targets/fuzz_versioned_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_token_2022_instruction"
path = "fuzz_targets/fuzz_token_2022_instruction.rs"
test = false
doc = false
bench = false
