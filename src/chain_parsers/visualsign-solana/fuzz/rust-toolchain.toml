# Nightly is required only because cargo-fuzz builds with -Zsanitizer=address, which stable rejects
# ("the option `Z` is only accepted on the nightly compiler"); no crate here uses #![feature].
# scripts/fuzz-nightly.sh moves this pin weekly (.github/workflows/fuzz-nightly.yml) and fails if stable
# can build the fuzz targets, which would mean the pin is no longer needed. The OSS-Fuzz build reads it too.
[toolchain]
channel = "nightly-2026-10-15"
