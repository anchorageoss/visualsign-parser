[package]
name = "visualsign-solana"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
default    = ["cli-plugin", "simulation", "stake-pool"]
cli-plugin = ["dep:clap", "dep:parser_cli_core"]
diagnostics = ["visualsign/diagnostics"]
# Solana's `jsonParsed` decoder for native programs, used by the intermediate
# output. Pulls solana-transaction-status 2.x (solana-sdk 2.x, openssl-sys,
# zstd-sys), which does not build for iOS. Off: native instructions in the
# intermediate output carry a `solana_json_parse_error` instead; the
# SignablePayload does not use this decoder.
json-parsed = ["dep:solana-transaction-status", "dep:solana-message-v2", "dep:solana-pubkey-v2"]
# Decode `simulateTransaction` results passed in metadata.
simulation = ["json-parsed", "dep:solana-rpc-client-types"]
# SPL Stake Pool preset (pulls the full spl-stake-pool program crate). Off:
# stake pool instructions are shown by the unknown-program visualizer.
stake-pool = ["dep:spl-stake-pool"]

[dependencies]
bs58            = "0.5"
clap            = { version = "4.0", features = ["derive"], optional = true }
parser_cli_core = { path = "../../parser/cli-core", optional = true }

tracing = { workspace = true }
# Pinned to anchorageoss/solana-parser#14 (split Anza crates). Repoint at
# anchorageoss/solana-parser once that PR merges.
solana_parser = { git = "https://github.com/iqlusioninc/solana-parser.git", rev = "f269037acaf697233048394e5ecae09320b442bf" }
visualsign = { workspace = true }
generated = { path = "../../generated" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = "0.22.1"
borsh = "1.5.5"
bincode = "1.3.3"
# Split Anza crates, not solana-sdk 2.x: solana-sdk pulls
# solana-secp256r1-program -> openssl-sys, which does not build for iOS.
solana-compute-budget-interface = { version = "3.1.0", features = ["borsh"] }
solana-hash = { version = "4.7.0" }
solana-instruction = { version = "4.0.0" }
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-message = { version = "6.0.0", features = ["serde"] }
solana-program-option = { version = "3.1.0" }
solana-pubkey = { version = "4.4.0", features = ["curve25519", "sha2"] }
solana-sdk-ids = { version = "3.1.0" }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-transaction = { version = "6.0.0", features = ["serde"] }
spl-token-interface = { version = "3.0.0" }
spl-token-2022-interface = { version = "3.1.2" }
# Feature-gated; see [features].
solana-transaction-status = { version = "2.2.7", optional = true }
solana-rpc-client-types = { version = "2.2.7", optional = true }
solana-message-v2 = { package = "solana-message", version = "2.4.0", optional = true }
solana-pubkey-v2 = { package = "solana-pubkey", version = "2.4.0", optional = true }
spl-stake-pool = { version = "2.0.2", optional = true }
# IDL signature validation. Solana uses ed25519 (its native curve); see
# `idl/signature.rs`. The Ethereum ABI path uses secp256k1 for its own curator
# key. Both verify a curator signature, not the program's on-chain authority.
ed25519-dalek = "2"
thiserror = "2.0.12"

[dev-dependencies]
# `Hash::new_unique` in tests.
solana-hash = { version = "4.7.0", features = ["atomic"] }
solana-signature = { version = "3.6.0", features = ["serde"] }
parser_cli_core = { path = "../../parser/cli-core", features = ["test-utils"] }
solana-parser-fuzz-core = { git = "https://github.com/iqlusioninc/solana-parser.git", rev = "f269037acaf697233048394e5ecae09320b442bf", features = ["proptest"] }
solana_test_utils = { path = "../../solana_test_utils" }
serde_json = "1.0"
jupiter-swap-api-client = "0.2.0"
base64 = "0.22.1"
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
