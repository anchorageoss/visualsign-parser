name: Benchmarks

# A/B benchmarks on GitHub-hosted runners: base and head run back to back on the
# same runner, on several runner types, so a perf claim doesn't rest on one
# developer machine. Runs on demand or when a PR carries the `test:bench` label; it
# is informational and not a required check.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Ref to compare against"
        required: true
        default: main
      filter:
        description: "Criterion filter regex (optional)"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'test:bench')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-latest-4-cores, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      FILTER: ${{ inputs.filter }}
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        working-directory: src
        run: rustup show active-toolchain || rustup toolchain install
      - name: install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "21.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install valgrind
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - name: Cache Rust dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
          key: bench-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Cache critcmp binary
        id: cache-critcmp
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cargo/bin/critcmp
          key: ${{ runner.os }}-${{ runner.arch }}-critcmp-0.1.8
      - name: Install critcmp
        if: steps.cache-critcmp.outputs.cache-hit != 'true'
        run: cargo install critcmp --locked --version 0.1.8
      # The script checks out base and head in turn, so run a copy that a
      # checkout can't change under bash.
      - name: Run A/B benchmarks
        run: |
          cp scripts/bench-ab.sh "$RUNNER_TEMP/bench-ab.sh"
          git fetch -q origin "$BASE_REF" || true
          BENCH_OUT="$RUNNER_TEMP/bench-out" bash "$RUNNER_TEMP/bench-ab.sh" "$BASE_REF" "$HEAD_REF" "$FILTER"
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/bench-out/
            src/target/criterion/
          if-no-files-found: ignore
