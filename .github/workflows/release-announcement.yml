name: Release announcement (docs)

# Opens a docs PR that publishes a release on the Mintlify site:
# - after every Release run: only when the release enables a new chain (blog post,
#   blog index stub, the chain's changelog page and nav entries);
# - on manual dispatch: changelog entries for every chain and core over a tag range
#   (plus the new-chain pages if the range adds one).
# It never pushes to main; a maintainer reviews and merges the PR.
# Note: a PR opened with GITHUB_TOKEN doesn't trigger other workflows; push an empty
# commit or close/reopen it to run checks.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      to:
        description: 'Release tag to publish (default: newest tag)'
        type: string
        required: false
      from:
        description: 'Previous release tag (default: the tag before "to")'
        type: string
        required: false

concurrency:
  group: release-announcement
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  docs:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1.13.0
        with:
          cache: false

      - name: Write release into docs
        id: write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TO: ${{ inputs.to }}
          FROM: ${{ inputs.from }}
          EVENT: ${{ github.event_name }}
        working-directory: src
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          args=(--repo-dir .. --repo "$GITHUB_REPOSITORY" --write-mintlify ../docs)
          [ -n "$TO" ] && args+=(--to "$TO")
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ "$EVENT" = workflow_run ] && args+=(--new-chains-only)
          cargo run -q -p release-notes -- "${args[@]}"
          tag="${TO:-$(git describe --tags --abbrev=0 HEAD)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git -C .. diff --quiet -- docs && [ -z "$(git -C .. ls-files --others --exclude-standard docs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open docs PR
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.write.outputs.tag }}
        run: |
          set -euo pipefail
          branch="docs/release-announcement-$TAG"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; not opening another PR"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs
          git commit -m "docs: publish $TAG on the changelog and blog"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: publish $TAG on the changelog and blog" \
            --body "Generated by \`release-notes --write-mintlify\` for $TAG (see the release-announcement skill). Review the wording before merging: lines come from PR titles unless a PR has a \`## Release note\` section. Generated posts can be edited freely; re-running for the same release won't overwrite them."
