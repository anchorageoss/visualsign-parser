name: "Fuzz Testing: Solana"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  fuzz:
    if: contains(github.event.pull_request.labels.*.name, 'test:fuzz')
    runs-on: ubuntu-latest-4-cores
    permissions:
      pull-requests: write
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      # The pin lives only in the fuzz crate's rust-toolchain.toml, so the weekly bump
      # (fuzz-nightly.yml) never edits a workflow file, which GITHUB_TOKEN cannot push.
      - name: Read the pinned nightly
        id: nightly
        run: echo "version=$(sed -n 's/^channel = "\(nightly-[0-9-]*\)"/\1/p' src/chain_parsers/visualsign-solana/fuzz/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.nightly.outputs.version }}
      - name: Install cargo-fuzz
        # An exact version; keep in step with CARGO_FUZZ_VERSION in fuzz-nightly.yml.
        run: cargo install cargo-fuzz --locked --version =0.13.1
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
            src/chain_parsers/visualsign-solana/fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('src/chain_parsers/visualsign-solana/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-
            ${{ runner.os }}-cargo-
      - name: install protoc
        run: scripts/install-protoc.sh
      - name: free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h
      - name: Run codegen
        run: make -C src generated
      - name: Fuzz fuzz_transaction_string (30s)
        id: fuzz_transaction_string
        continue-on-error: true
        env:
          NIGHTLY: ${{ steps.nightly.outputs.version }}
        run: cargo +"$NIGHTLY" fuzz run fuzz_transaction_string -- -max_total_time=30
        working-directory: src/chain_parsers/visualsign-solana/fuzz
      - name: Fuzz fuzz_versioned_transaction (30s)
        id: fuzz_versioned_transaction
        continue-on-error: true
        env:
          NIGHTLY: ${{ steps.nightly.outputs.version }}
        run: cargo +"$NIGHTLY" fuzz run fuzz_versioned_transaction -- -max_total_time=30
        working-directory: src/chain_parsers/visualsign-solana/fuzz
      - name: Label PR on fuzz failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ steps.fuzz_transaction_string.outcome }}" = "failure" ] || [ "${{ steps.fuzz_versioned_transaction.outcome }}" = "failure" ]; then
            gh pr edit "$PR_NUMBER" --add-label test:fuzz-failure || true
          else
            gh pr edit "$PR_NUMBER" --remove-label test:fuzz-failure || true
          fi
