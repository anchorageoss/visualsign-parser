name: "Fuzz Testing: Solana"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  NIGHTLY_VERSION: nightly-2026-03-13

jobs:
  fuzz:
    if: contains(github.event.pull_request.labels.*.name, 'test:fuzz')
    runs-on: ubuntu-latest-4-cores
    permissions:
      pull-requests: write
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
            src/chain_parsers/visualsign-solana/fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('src/chain_parsers/visualsign-solana/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-
            ${{ runner.os }}-cargo-
      - name: install protoc
        run: scripts/install-protoc.sh
      - name: free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h
      - name: Run codegen
        run: make -C src generated
      - name: Fuzz fuzz_transaction_string (30s)
        id: fuzz_transaction_string
        continue-on-error: true
        run: cargo +${{ env.NIGHTLY_VERSION }} fuzz run fuzz_transaction_string -- -max_total_time=30
        working-directory: src/chain_parsers/visualsign-solana/fuzz
      - name: Fuzz fuzz_versioned_transaction (30s)
        id: fuzz_versioned_transaction
        continue-on-error: true
        run: cargo +${{ env.NIGHTLY_VERSION }} fuzz run fuzz_versioned_transaction -- -max_total_time=30
        working-directory: src/chain_parsers/visualsign-solana/fuzz
      - name: Label PR on fuzz failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ steps.fuzz_transaction_string.outcome }}" = "failure" ] || [ "${{ steps.fuzz_versioned_transaction.outcome }}" = "failure" ]; then
            gh pr edit "$PR_NUMBER" --add-label test:fuzz-failure || true
          else
            gh pr edit "$PR_NUMBER" --remove-label test:fuzz-failure || true
          fi
