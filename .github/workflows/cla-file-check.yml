name: cla-file-check

# pull_request_target is required: the job comments on fork PRs, and a fork's
# `pull_request` token is read-only. It is safe only because the job never
# checks out, builds or runs PR code: the sole checkout is `.cla-signed-users`
# from main, and PR fields (number, author login) reach the shell only through
# env vars. Keep it that way; don't add steps that touch the PR's head.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no PR code is checked out or run; see above
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  check-cla-file:
    # Skip CLA check for bots (e.g., github-actions[bot], dependabot[bot])
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-26.04
    permissions:
      contents: read        # checkout of .cla-signed-users from main
      pull-requests: write  # read and post the CLA comment

    # Environment variables for easy configuration
    env:
      CLA_URL: "https://ironcladapp.com/public-launch/6896309b0f158de8c7450de6"
      MAINTAINER_TAG: "@anchorageoss/maintainers"

    steps:
      # Only main's copy of .cla-signed-users, never the PR head. A missing
      # file is handled by the next step (treated as "not signed").
      - name: Checkout CLA file from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          sparse-checkout: .cla-signed-users
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check for username in .cla-signed-users
        id: check_user
        env:
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          # Fixed-string, whole-line match (grep -Fxq): GitHub logins like
          # `github-actions[bot]` contain regex metacharacters, so `grep -w`
          # would misbehave. A missing file is treated as "not signed" rather
          # than erroring the workflow.
          if [ -f .cla-signed-users ] && grep -v '^#' .cla-signed-users | grep -Fxq "$PR_USER"; then
            echo "✅ User found in .cla-signed-users file."
            echo "is_signed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ User not found (or CLA file missing). Please acknowledge the CLA."
            echo "is_signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if CLA comment already exists
        if: steps.check_user.outputs.is_signed == 'false'
        id: check_comment
        run: |
          # Check if github-actions bot has already commented about CLA on this PR
          COMMENTS=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[] | select(.author.login == "github-actions") | .body')

          if echo "$COMMENTS" | grep -Fq "$CLA_URL"; then
            echo "CLA comment already exists, skipping"
            echo "comment_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No CLA comment found, will post one"
            echo "comment_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment on PR if user is not signed
        if: steps.check_user.outputs.is_signed == 'false' && steps.check_comment.outputs.comment_exists == 'false'
        # PR fields reach the shell only through env, never through ${{ }} in
        # run:. CLA_URL and MAINTAINER_TAG come from the job-level env.
        run: |
          gh pr comment "$PR_NUMBER" --body "Hi @${PR_USER}, thank you for your contribution!

          It looks like this is your first time contributing. To get this PR merged, please review our Contributor License Agreement (CLA) here: **${CLA_URL}**

          Once you have reviewed the agreement, a maintainer (${MAINTAINER_TAG}) will need to approve your addition to our contributors list by commenting \`/approve-cla\` on this PR. Thank you!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_USER: ${{ github.event.pull_request.user.login }}

      - name: Fail the check if user is not signed
        if: steps.check_user.outputs.is_signed == 'false'
        run: |
          echo "This check failed because the PR author has not signed the CLA."
          exit 1
