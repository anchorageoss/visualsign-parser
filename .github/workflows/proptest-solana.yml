name: "Property Tests: Solana"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  proptest:
    if: contains(github.event.pull_request.labels.*.name, 'test:proptest')
    runs-on: ubuntu-latest-4-cores
    permissions:
      pull-requests: write
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/target/
          key: ${{ runner.os }}-cargo-proptest-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-proptest-
            ${{ runner.os }}-cargo-
      - name: install protoc
        run: scripts/install-protoc.sh
      - name: free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h
      - name: Run codegen
        run: make -C src generated
      - name: Run proptest tests
        id: proptest
        continue-on-error: true
        run: cargo test -p visualsign-solana
        working-directory: src
      - name: Label PR on proptest failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ steps.proptest.outcome }}" = "failure" ]; then
            gh pr edit "$PR_NUMBER" --add-label test:proptest-failure || true
          else
            gh pr edit "$PR_NUMBER" --remove-label test:proptest-failure || true
          fi
