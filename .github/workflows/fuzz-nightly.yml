name: Fuzz Nightly

# The fuzz crate needs a nightly toolchain only because cargo-fuzz builds with -Zsanitizer=address.
# Weekly: (1) check stable still cannot build the fuzz targets, so the nightly pin is still needed;
# (2) try the newest nightly and open or update a PR that moves the pin if it builds and fuzzes cleanly.
# Opening the PR needs "Allow GitHub Actions to create and approve pull requests" in the repo settings.
# A PR created with GITHUB_TOKEN does not start other workflows, so run `Fuzz Testing: Solana` on it by hand.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # An exact version, as docs/contributor-guides/best-practices.mdx requires; keep in step with fuzz-solana.yml.
  CARGO_FUZZ_VERSION: "0.13.1"

jobs:
  nightly-still-needed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-fuzz --locked --version "=$CARGO_FUZZ_VERSION"
      - run: scripts/fuzz-nightly.sh check-needed

  # Builds and fuzzes candidate nightlies, which runs every dependency's build.rs and proc macros. It holds
  # no write token: it only reports the validated nightly for open-bump-pr to apply.
  validate-nightly:
    runs-on: ubuntu-latest
    outputs:
      nightly: ${{ steps.pin.outputs.nightly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-fuzz --locked --version "=$CARGO_FUZZ_VERSION"
      - run: scripts/fuzz-nightly.sh bump
      - name: Report the new pin
        id: pin
        run: |
          git diff --quiet && exit 0
          echo "nightly=$(scripts/fuzz-nightly.sh current)" >> "$GITHUB_OUTPUT"

  # Holds the write token and runs no repository code: it re-applies validate-nightly's pin with sed,
  # then commits and pushes.
  open-bump-pr:
    needs: validate-nightly
    if: needs.validate-nightly.outputs.nightly != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes the bump branch with this token.
          persist-credentials: true
      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ needs.validate-nightly.outputs.nightly }}
        run: |
          set -euo pipefail
          pin=src/chain_parsers/visualsign-solana/fuzz/rust-toolchain.toml
          [[ "$NEW" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "error: unexpected nightly '$NEW'" >&2; exit 1; }
          sed -i "s/^channel = \"nightly-[0-9-]*\"/channel = \"$NEW\"/" "$pin"
          git diff --quiet && { echo "pin already $NEW"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/fuzz-nightly-bump
          git commit -am "ci(fuzz): bump the fuzz nightly to $NEW"
          git push --force origin bot/fuzz-nightly-bump
          title="ci(fuzz): bump the fuzz nightly to $NEW"
          body="Weekly bump. \`scripts/fuzz-nightly.sh bump\` built both fuzz targets and fuzzed each for 20s on $NEW. Run \`Fuzz Testing: Solana\` on this PR before merging."
          existing=$(gh pr list --head bot/fuzz-nightly-bump --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base main --head bot/fuzz-nightly-bump --title "$title" --body "$body"
          else
            # The force-push moved the open PR to a newer nightly; keep its title and body in step.
            gh pr edit "$existing" --title "$title" --body "$body"
          fi
