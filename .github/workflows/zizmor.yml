name: zizmor

# Static analysis of our GitHub Actions workflows and composite actions
# (template injection, dangerous triggers, credential persistence, excessive
# permissions, impostor or known-vulnerable actions, ...).
# https://docs.zizmor.sh
#
# Plain `pull_request` (never `pull_request_target`): the job only reads the
# checked-out YAML. Every run gets GitHub annotations, and any finding fails
# the job. Findings also go to code scanning (SARIF), but only for runs in our
# own repo that aren't fork PRs: fork PRs get a read-only token, so they can't
# upload SARIF.

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning only
    env:
      # 'true' only in our repo, and never for PRs from forks.
      UPLOAD_SARIF: ${{ github.repository == 'anchorageoss/visualsign-parser' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Installs zizmor from a hash-pinned wheel lockfile inside the action's
      # own tree, so the zizmor bytes are fixed by this SHA. Online audits stay
      # on (the default), as before, and use the job token.
      #
      # Two passes, because zizmor never fails on findings with
      # `--format=sarif`. The annotations pass always runs and is the one that
      # fails the job (and so the required status). The SARIF pass only feeds
      # code scanning, and runs even when the gate fails.
      - name: Run zizmor (gate)
        id: gate
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          inputs: .github
          advanced-security: false
          annotations: true

      - name: Run zizmor (SARIF to code scanning)
        if: ${{ always() && env.UPLOAD_SARIF == 'true' }}
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          inputs: .github
          advanced-security: true
