name: "Solana: nightly preset IDL sync"

# Keeps the preset IDLs compiled into visualsign-solana in sync with the
# Anchor IDLs the programs publish on chain, and shows reviewers what each
# change does to real transactions:
#
#   presets -> the matrix of programs + committed IDL paths (solana-idl-sync
#              list-presets)
#   fetch   -> re-fetches every on-chain IDL by calling
#              .github/workflows/solana-idl-fetch.yml (workflow_call)
#   replay  -> read-only: builds parser_cli "before", applies changed IDLs
#              (solana-idl-sync apply), and if anything changed builds
#              parser_cli "after", replays recent successful mainnet
#              transactions of every changed program through both
#              (solana-idl-sync replay, over Helius RPC), assembles the
#              report (solana-idl-sync report) and emits validated
#              outputs/artifacts: the changed IDL + provenance files
#              (paths preserved) and report.md / report.full.md.
#   open-pr -> holds the write token and runs NO repository code: it
#              re-validates every received file path against the preset
#              IDL paths (and their .provenance.json siblings), checks
#              each file is JSON and each record hashes its IDL, copies
#              the files into place, commits as github-actions[bot],
#              force-pushes bot/solana-idl-sync and opens or updates the
#              PR.
#
# A PR created with GITHUB_TOKEN does not start other workflows; the note
# in the PR body says to run the checks by hand, same as fuzz-nightly.
#
# Run by hand (workflow_dispatch) to force a sync outside the schedule.

on:
  schedule:
    # Nightly, off the hour so shared runners are not slammed at :00.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presets:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache: false
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/git/db/
            src/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h
      - name: List the preset IDLs
        id: list
        env:
          # Invoked from the repo root via --manifest-path, so pin the
          # target dir to the one the cache step above caches.
          CARGO_TARGET_DIR: src/target
        run: |
          set -euo pipefail
          matrix=$(cargo run --manifest-path src/Cargo.toml --locked --release -q -p solana-idl-sync -- list-presets)
          # The matrix only reaches the fetch job's inputs, but validate
          # the shape here so a broken tool fails loudly and early.
          echo "$matrix" | jq -e 'type == "array" and length > 0 and
            all(.[]; (.program_id | test("^[1-9A-HJ-NP-Za-km-z]{32,44}$")) and
                 (.idl_path | test("^src/chain_parsers/visualsign-solana/src/presets/[a-z0-9_]+/[A-Za-z0-9_.-]+[.]json$")))' >/dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fetch:
    needs: presets
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.matrix) }}
    uses: ./.github/workflows/solana-idl-fetch.yml
    with:
      program_id: ${{ matrix.preset.program_id }}
      committed_idl: ${{ matrix.preset.idl_path }}

  replay:
    needs: [presets, fetch]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
      paths: ${{ steps.paths.outputs.paths }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache: false
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/git/db/
            src/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h
      - name: Build parser_cli (before)
        env:
          CARGO_TARGET_DIR: src/target
        run: |
          set -euo pipefail
          cargo build --manifest-path src/Cargo.toml --locked --release -p parser_cli \
            --no-default-features --features solana
          cp src/target/release/parser_cli before-parser_cli
      - name: Download the fetched IDLs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # One artifact per preset (idl-<program_id>, only for programs
          # that publish an on-chain IDL), merged into one directory.
          pattern: idl-*
          merge-multiple: true
          path: fetched
      - name: Apply the changed IDLs
        id: apply
        env:
          CARGO_TARGET_DIR: src/target
        run: |
          set -euo pipefail
          mkdir -p fetched report
          changed=$(cargo run --manifest-path src/Cargo.toml --locked --release -q -p solana-idl-sync -- \
            apply --fetched-dir fetched --repo-root . --sections-dir report)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "[]" ]; then
            {
              echo "### No IDL changes"
              echo
              echo "Every preset's on-chain IDL matches the committed one; no PR is needed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build parser_cli (after)
        if: steps.apply.outputs.changed != '[]'
        env:
          CARGO_TARGET_DIR: src/target
        run: |
          set -euo pipefail
          cargo build --manifest-path src/Cargo.toml --locked --release -p parser_cli \
            --no-default-features --features solana
          cp src/target/release/parser_cli after-parser_cli
      - name: Test visualsign-solana on the updated tree
        # Pass or fail is recorded in the report; a failing preset must not
        # stop the report (or the PR) from being produced.
        if: steps.apply.outputs.changed != '[]'
        env:
          CARGO_TARGET_DIR: src/target
        run: |
          set +e
          cargo test --manifest-path src/Cargo.toml --locked -p visualsign-solana > test-output.txt 2>&1
          rc=$?
          set -e
          tail -n 40 test-output.txt
          if [ "$rc" -eq 0 ]; then outcome=passed; else outcome="failed (exit $rc)"; fi
          {
            echo "### \`cargo test -p visualsign-solana\` on the updated tree: $outcome"
            echo
            echo '```'
            tail -n 5 test-output.txt | tr '`' "'"
            echo '```'
          } > report/context-cargo-test.md
      - name: Replay the changed programs
        # The RPC URL carries the Helius key: it is built here, in this
        # step's env only, and solana-idl-sync never prints it.
        if: steps.apply.outputs.changed != '[]'
        env:
          CARGO_TARGET_DIR: src/target
          SOLANA_RPC_URL: https://mainnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          set -euo pipefail
          for pid in $(jq -r '.[]' <<<"$CHANGED"); do
            [[ "$pid" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]] \
              || { echo "::error::changed program id '$pid' is not base58"; exit 1; }
            cargo run --manifest-path src/Cargo.toml --locked --release -q -p solana-idl-sync -- \
              replay --program-id "$pid" --before before-parser_cli --after after-parser_cli \
              --limit 5 --out-dir report
          done
      - name: Assemble the report
        if: steps.apply.outputs.changed != '[]'
        env:
          CARGO_TARGET_DIR: src/target
        run: cargo run --manifest-path src/Cargo.toml --locked --release -q -p solana-idl-sync -- \
          report --dir report --max-bytes 60000
      - name: Write the report to the step summary
        if: steps.apply.outputs.changed != '[]'
        run: cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the changed IDL and record files
        # Paths preserved (repo-root relative) so the open-pr job can
        # validate them against the preset IDL paths before applying.
        if: steps.apply.outputs.changed != '[]'
        env:
          MATRIX: ${{ needs.presets.outputs.matrix }}
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          set -euo pipefail
          mkdir -p changed
          for pid in $(jq -r '.[]' <<<"$CHANGED"); do
            [[ "$pid" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]] \
              || { echo "::error::changed program id '$pid' is not base58"; exit 1; }
            idl_path=$(jq -r --arg pid "$pid" '.[] | select(.program_id == $pid) | .idl_path' <<<"$MATRIX")
            [ -n "$idl_path" ] || { echo "::error::no preset entry for $pid"; exit 1; }
            record_path="${idl_path%.json}.provenance.json"
            cp --parents "$idl_path" changed/
            cp --parents "$record_path" changed/
          done
      - name: Compute the allowed path list
        id: paths
        env:
          MATRIX: ${{ needs.presets.outputs.matrix }}
        run: |
          set -euo pipefail
          paths=$(jq -c '[.[] | .idl_path as $p | $p, ($p | sub("[.]json$"; ".provenance.json"))] | unique' <<<"$MATRIX")
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
      - name: Upload the changed IDLs
        if: steps.apply.outputs.changed != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changed-idls
          path: changed
          if-no-files-found: error
          retention-days: 14
      - name: Upload the report
        if: steps.apply.outputs.changed != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: |
            report/report.md
            report/report.full.md
          if-no-files-found: error
          retention-days: 14

  open-pr:
    needs: [presets, replay]
    if: needs.replay.outputs.changed != '[]' && needs.replay.outputs.changed != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      # Every ${{ }} value reaches the shell through these env vars only.
      CHANGED: ${{ needs.replay.outputs.changed }}
      PATHS: ${{ needs.replay.outputs.paths }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes the bot branch with this token.
          persist-credentials: true
      - name: Download the changed IDLs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changed-idls
          path: changed-files
      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report
          path: report
      - name: Validate the received files
        # No repository code runs in this job: only jq + sha256sum, applied
        # to what the read-only replay job produced. Every path must be
        # exactly one of the preset IDL paths or its .provenance.json
        # sibling, every file must parse as JSON, and every record must
        # hash the exact IDL bytes it ships with.
        run: |
          set -euo pipefail
          n=$(jq -r 'length' <<<"$CHANGED")
          count=0
          while IFS= read -r file; do
            rel=${file#changed-files/}
            jq -e --arg p "$rel" 'any(.[]; . == $p)' <<<"$PATHS" >/dev/null \
              || { echo "::error::unexpected path $rel (allowed: the preset IDL paths and their provenance records)"; exit 1; }
            jq empty "$file" || { echo "::error::$rel is not valid JSON"; exit 1; }
            case "$rel" in
              *.provenance.json) ;;
              *)
                record="changed-files/${rel%.json}.provenance.json"
                expected=$(jq -r '.idl_sha256' "$record")
                actual=$(sha256sum "$file" | cut -d' ' -f1)
                [ "$expected" = "$actual" ] \
                  || { echo "::error::the provenance record next to $rel does not hash the IDL bytes"; exit 1; }
                ;;
            esac
            count=$((count + 1))
          done < <(find changed-files -type f)
          [ "$count" -eq $((2 * n)) ] \
            || { echo "::error::expected $((2 * n)) files for $n changed programs (one IDL and one record each), found $count"; exit 1; }
      - name: Apply, commit and open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            rel=${file#changed-files/}
            mkdir -p "$(dirname "$rel")"
            cp "$file" "$rel"
          done < <(find changed-files -type f)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/solana-idl-sync
          git add -A -- src/chain_parsers/visualsign-solana/src/presets
          git commit -m "chore(solana): sync preset IDLs from chain"
          git push --force origin bot/solana-idl-sync
          n=$(jq -r 'length' <<<"$CHANGED")
          title="chore(solana): sync preset IDLs from chain ($n programs)"
          note='
          ---
          This PR is opened by the nightly `solana-idl-nightly` workflow with `GITHUB_TOKEN`, which does not trigger other CI workflows. Run the checks on it by hand (like `fuzz-nightly` asks for its PRs), at minimum `make -C src test`.'
          body="$(cat report/report.md)$note"
          existing=$(gh pr list --head bot/solana-idl-sync --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base main --head bot/solana-idl-sync --title "$title" --body "$body"
          else
            gh pr edit "$existing" --title "$title" --body "$body"
          fi
